; 1. Production Security Settings (Hide PHP version & errors from end users)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /home/vol15_1/rf.gd/xxxx/htdocs/php_errors.log
expose_php = Off

; 2. File Upload Limits (Adjust as needed for product images)
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 20

; 3. Resource Limits
max_execution_time = 60
max_input_time = 60
memory_limit = 128M

; 4. Session Security Parameters
session.cookie_httponly = 1
session.use_only_cookies = 1
session.cookie_secure = 1